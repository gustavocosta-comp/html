<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Pong Game</title>\n    <style>\n        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: black; }\n        canvas { border: 1px solid white; }\n    </style>\n</head>\n<body>\n    <canvas id="pong" width="800" height="400"></canvas>\n    <script>\n        const canvas = document.getElementById('pong');\n        const context = canvas.getContext('2d');\n\n        // Create the pong paddle and ball dimensions\n        const paddleWidth = 10;\n        const paddleHeight = 100;\n        const ballSize = 10;\n\n        // Initialize player and AI paddles, ball\n        const player = {\n            x: 0,\n            y: canvas.height / 2 - paddleHeight / 2,\n            width: paddleWidth,\n            height: paddleHeight,\n            color: 'white',\n            score: 0\n        };\n\n        const ai = {\n            x: canvas.width - paddleWidth,\n            y: canvas.height / 2 - paddleHeight / 2,\n            width: paddleWidth,\n            height: paddleHeight,\n            color: 'white',\n        };\n\n        const ball = {\n            x: canvas.width / 2 - ballSize / 2,\n            y: canvas.height / 2 - ballSize / 2,\n            width: ballSize,\n            height: ballSize,\n            speed: 4,\n            dx: 4,\n            dy: 4,\n            color: 'white'\n        };\n\n        function drawRect(x, y, width, height, color) {\n            context.fillStyle = color;\n            context.fillRect(x, y, width, height);\n        }\n\n        function drawCircle(x, y, size, color) {\n            context.fillStyle = color;\n            context.beginPath();\n            context.arc(x, y, size, 0, Math.PI * 2, false);\n            context.closePath();\n            context.fill();\n        }\n\n        function drawScore() {\n            context.font = '35px Arial';\n            context.fillStyle = 'white';\n            context.fillText(player.score, canvas.width / 4, canvas.height / 5);\n            context.fillText(ai.score, 3 * canvas.width / 4, canvas.height / 5);\n        }\n\n        function update() {\n            ball.x += ball.dx;\n            ball.y += ball.dy;\n\n            // Ball collision with top and bottom walls\n            if (ball.y + ball.height > canvas.height || ball.y < 0) {\n                ball.dy *= -1;\n            }\n\n            // Ball collision with paddles\n            if (ball.x < player.x + player.width && ball.x > player.x && ball.y + ball.height > player.y && ball.y < player.y + player.height) {\n                ball.dx *= -1;\n            }\n            if (ball.x + ball.width > ai.x && ball.x < ai.x + ai.width && ball.y + ball.height > ai.y && ball.y < ai.y + ai.height) {\n                ball.dx *= -1;\n            }\n\n            // Ball resets when it goes off the screen\n            if (ball.x < 0) {\n                ai.score++;\n                resetBall();\n            } else if (ball.x + ball.width > canvas.width) {\n                player.score++;\n                resetBall();\n            }\n\n            // AI paddle follows the ball\n            ai.y = ball.y - ai.height / 2;\n        }\n\n        function resetBall() {\n            ball.x = canvas.width / 2 - ballSize / 2;\n            ball.y = canvas.height / 2 - ballSize / 2;\n            ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);\n            ball.dy = 4 * (Math.random() > 0.5 ? 1 : -1);\n        }\n\n        function game() {\n            drawRect(0, 0, canvas.width, canvas.height, 'black');\n            drawScore();\n            drawRect(player.x, player.y, player.width, player.height, player.color);\n            drawRect(ai.x, ai.y, ai.width, ai.height, ai.color);\n            drawCircle(ball.x, ball.y, ball.width / 2, ball.color);\n            update();\n        }\n\n        document.addEventListener('mousemove', (event) => {\n            const rect = canvas.getBoundingClientRect();\n            const mouseY = event.clientY - rect.top;\n            if (mouseY > 0 && mouseY < canvas.height) {\n                player.y = mouseY - player.height / 2;\n            }\n        });\n\n        document.addEventListener('keydown', (event) => {\n            if (event.key === 'ArrowUp' && player.y > 0) {\n                player.y -= 20;\n            } else if (event.key === 'ArrowDown' && player.y < canvas.height - player.height) {\n                player.y += 20;\n            }\n        });\n\n        function gameLoop() {\n            requestAnimationFrame(gameLoop);\n            game();\n        }\n\n        resetBall();\n        gameLoop();\n    </script>\n</body>\n</html>
